<script>
        // Micro-interactions and Tab Logic
        const tabs = document.querySelectorAll('nav button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // This is a simple visual demo of tab switching
                if (tab.parentElement.classList.contains('px-4')) { // It's the profile tabs
                    tabs.forEach(t => {
                        if (t.parentElement.classList.contains('px-4')) {
                            t.classList.remove('text-primary');
                            t.classList.add('text-on-surface-variant');
                            const indicator = t.querySelector('.active-tab-indicator');
                            if (indicator) indicator.remove();
                        }
                    });
                    tab.classList.remove('text-on-surface-variant');
                    tab.classList.add('text-primary');
                    const newIndicator = document.createElement('div');
                    newIndicator.className = 'active-tab-indicator';
                    tab.appendChild(newIndicator);
                }
            });
        });

        // Add subtle scale interaction to buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.transform = 'scale(0.96)';
            });
            btn.addEventListener('touchend', () => {
                btn.style.transform = 'scale(1)';
            });
        });
    </script>
